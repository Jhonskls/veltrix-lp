<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELTRIX OS | Free Google Business Profile audit</title>
<meta name="description" content="Request a free audit of your Google Business Profile.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Crect%20width%3D%22120%22%20height%3D%22120%22%20rx%3D%2228%22%20fill%3D%22%230A1A33%22/%3E%3Cpath%20d%3D%22M32%2040%20L54%2082%22%20stroke%3D%22%23F7F4EC%22%20stroke-width%3D%2212%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22/%3E%3Cpath%20d%3D%22M54%2082%20L90%2030%22%20stroke%3D%22%23D6A936%22%20stroke-width%3D%2212%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22/%3E%3C/svg%3E">
<!-- Cole aqui o Meta Pixel e a tag do Google Ads / GA4 (a LP já dispara "Lead" no envio, se eles existirem) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--navy:#0A1A33;--navy2:#12305C;--gold:#D6A936;--ivory:#F7F4EC;--slate:#4A5468;--mist:#C9D0DE;--rule:#D9D3C2;--err:#B42318}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--navy);background:var(--ivory);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Sora',system-ui,sans-serif;margin:0;line-height:1.12;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--navy2);outline-offset:3px}
.dark :focus-visible{outline-color:var(--gold)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.dark{background:var(--navy);color:var(--ivory)}

/* header */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0}
.logo{height:38px;width:auto;display:block}
.lang{display:flex;gap:4px}
.lang button{min-height:44px;min-width:44px;padding:0 10px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mist);font:600 .9rem 'Inter',sans-serif;cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--ivory);border-bottom-color:var(--gold)}

/* hero */
.hero{padding:48px 0 96px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:64px;align-items:center}
.hero h1{font-weight:800;font-size:clamp(2.1rem,4.7vw,3.7rem);letter-spacing:-.01em;color:var(--ivory)}
.sub{font-size:1.15rem;color:#D3D9E6;max-width:54ch;margin:24px 0 32px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:12px;background:var(--gold);color:var(--navy);font:600 1rem 'Sora',sans-serif;text-decoration:none;border:0;cursor:pointer}
.btn:hover{background:#E4BB4D}
.btn[disabled]{opacity:.65;cursor:progress}
.trust{margin-top:16px;font-size:.92rem;color:#B5BED0}
.panel{background:var(--navy2);border-radius:20px;padding:32px}
.panel h2{font-weight:600;font-size:1.05rem;color:var(--ivory);margin-bottom:12px}
.panel ul{list-style:none;margin:0;padding:0}
.panel li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid rgba(247,244,236,.18);color:var(--ivory)}
.panel li:first-child{border-top:0}
.tick{flex:none;margin-top:2px}
.tick path{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s ease forwards;animation-delay:calc(var(--i) * .3s + .4s)}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.tick path{animation:none;stroke-dashoffset:0}html{scroll-behavior:auto}}

/* found / chosen / booked */
.fcb{padding:88px 0}
.fcb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px}
.fcb-item{border-top:2px solid var(--navy);padding-top:20px}
.fcb-item h3{font-weight:800;font-size:2rem;margin-bottom:12px}
.fcb-item p{color:var(--slate);max-width:34ch}

/* steps */
.steps{padding:0 0 96px}
.steps h2{font-weight:800;font-size:clamp(1.6rem,3vw,2.2rem);margin-bottom:40px}
.steps ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px}
.step-n{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--navy);color:var(--ivory);font:600 1rem 'Sora',sans-serif;margin-bottom:16px}
.steps h3{font-weight:600;font-size:1.15rem;margin-bottom:8px}
.steps p{color:var(--slate);max-width:36ch}

/* form */
.request{padding:88px 0}
.request-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:64px;align-items:start}
.request h2{font-weight:800;font-size:clamp(1.8rem,3.4vw,2.6rem);color:var(--ivory)}
.request .lead{margin:16px 0 32px;color:#D3D9E6;font-size:1.1rem;max-width:40ch}
.who{color:var(--ivory);font-weight:500;border-top:1px solid rgba(247,244,236,.22);padding-top:20px;max-width:40ch}
.card{background:#fff;color:var(--navy);border-radius:20px;padding:32px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 16px}
.full{grid-column:1 / -1}
label,.lbl{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=datetime-local],select{width:100%;min-height:48px;padding:10px 14px;border:1.5px solid #7A8396;border-radius:10px;font:400 1rem 'Inter',sans-serif;background:#fff;color:var(--navy)}
input:focus,select:focus{outline:3px solid var(--navy2);outline-offset:1px;border-color:var(--navy2)}
[aria-invalid="true"]{border-color:var(--err)!important}
.help{font-size:.85rem;color:var(--slate);margin-top:6px}
.err{font-size:.85rem;color:var(--err);margin-top:6px}
.err:empty{display:none}
.consent{display:flex;gap:12px;align-items:flex-start}
.consent input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--navy2)}
.consent label{margin:0;font-weight:500}
.fine{font-size:.85rem;color:var(--slate)}
.card .btn{width:100%}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.status{margin-top:12px;font-weight:600}
.status.bad{color:var(--err)}
.done h3{font-weight:800;font-size:1.6rem;margin-bottom:12px}
.done p{color:var(--slate)}

/* faq */
.faq{padding:88px 0}
.faq h2{font-weight:800;font-size:clamp(1.6rem,3vw,2.2rem);margin-bottom:24px}
details{border-top:1px solid var(--rule);padding:4px 0}
details:last-of-type{border-bottom:1px solid var(--rule)}
summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600;font-family:'Sora',sans-serif;font-size:1.02rem}
details p{color:var(--slate);padding:0 0 16px;max-width:64ch}

/* footer + sticky */
footer{padding:32px 0 40px;font-size:.85rem;color:#B5BED0}
.sticky{position:fixed;left:16px;right:16px;bottom:16px;z-index:20;display:none}
.sticky .btn{width:100%;box-shadow:0 6px 24px rgba(10,26,51,.35)}
.sticky.off{display:none!important}

@media (max-width:860px){
  .hero{padding:24px 0 64px}
  .hero-grid,.request-grid{grid-template-columns:1fr;gap:40px}
  .fcb-grid,.steps ol{grid-template-columns:1fr;gap:32px}
  .fcb,.faq,.request{padding:64px 0}
  .steps{padding-bottom:64px}
  .grid{grid-template-columns:1fr}
  .card{padding:24px}
  .sticky{display:block}
  footer{padding-bottom:96px}
}
</style>
</head>

<section class="dark request" id="request">

    <div>
      <h2 id="form_title"></h2>
      <p class="lead" id="form_sub"></p>
      <p class="who" id="who"></p>
    </div>
    <div class="card">
      <form id="leadForm" novalidate>
        <div class="grid">
          <div><label for="name" data-f="name"></label><input type="text" id="name" name="name" autocomplete="name" maxlength="80" aria-describedby="e_name"><div class="err" id="e_name" aria-live="polite"></div></div>
          <div><label for="email" data-f="email"></label><input type="email" id="email" name="email" autocomplete="email" maxlength="120" aria-describedby="e_email"><div class="err" id="e_email" aria-live="polite"></div></div>
          <div><label for="phone" data-f="phone"></label><input type="tel" id="phone" name="phone" autocomplete="tel" maxlength="40" aria-describedby="e_phone"><div class="err" id="e_phone" aria-live="polite"></div></div>
          <div><label for="contact_pref" data-f="contact_pref"></label><select id="contact_pref" name="contact_pref" data-opts="contact_pref"></select></div>
          <div><label for="business" data-f="business"></label><input type="text" id="business" name="business" autocomplete="organization" maxlength="120" aria-describedby="e_business"><div class="err" id="e_business" aria-live="polite"></div></div>
          <div><label for="niche" data-f="niche"></label><select id="niche" name="niche" data-opts="niche" aria-describedby="e_niche"></select><div class="err" id="e_niche" aria-live="polite"></div></div>
          <div class="full"><label for="location" data-f="location"></label><input type="text" id="location" name="location" maxlength="120" aria-describedby="e_location"><div class="err" id="e_location" aria-live="polite"></div></div>
          <div class="full"><label for="gbp" data-f="gbp"></label><input type="text" id="gbp" name="gbp" maxlength="300" aria-describedby="h_gbp e_gbp"><div class="help" id="h_gbp" data-f="gbp_help"></div><div class="err" id="e_gbp" aria-live="polite"></div></div>
          <div class="full"><label for="gbp_status" data-f="gbp_status"></label><select id="gbp_status" name="gbp_status" data-opts="gbp_status" aria-describedby="e_gbp_status"></select><div class="err" id="e_gbp_status" aria-live="polite"></div></div>
          <div class="full"><label for="challenge" data-f="challenge"></label><select id="challenge" name="challenge" data-opts="challenge" aria-describedby="e_challenge"></select><div class="err" id="e_challenge" aria-live="polite"></div></div>
          <div class="full"><label for="timing" data-f="timing"></label><select id="timing" name="timing" data-opts="timing" aria-describedby="e_timing"></select><div class="err" id="e_timing" aria-live="polite"></div></div>
          <div class="full"><label for="meeting_local" data-f="meeting"></label><input type="datetime-local" id="meeting_local" name="meeting_local" aria-describedby="h_meeting"><div class="help" id="h_meeting" data-f="meeting_help"></div></div>

          <div class="hp" aria-hidden="true"><label for="website">Website</label><input type="text" id="website" name="website" tabindex="-1" autocomplete="off"></div>
          <div class="full"><button class="btn" type="submit" id="submitBtn"></button><div class="status" id="status" role="status" aria-live="polite"></div></div>
        </div>
      </form>
      <div class="done" id="done" hidden tabindex="-1">
        <h3 id="done_title"></h3>
        <p id="done_text"></p>
      </div>
    </div>
  </div>
</section>

var REQUIRED = ['name','email','phone','business','niche','location','gbp','gbp_status','challenge','timing'];
var lang = 'en';

function $(id){ return document.getElementById(id); }
function el(tag, cls, text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }

function pickLang(){
  var q = new URLSearchParams(location.search).get('lang');
  if (q && I18N[q]) return q;
  var nav = (navigator.language || 'en').slice(0,2).toLowerCase();
  return I18N[nav] ? nav : 'en';
}

function tickSvg(i){
  var ns = 'http://www.w3.org/2000/svg';
  var s = document.createElementNS(ns,'svg');
  s.setAttribute('class','tick'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('width','22'); s.setAttribute('height','22'); s.setAttribute('aria-hidden','true');
  s.style.setProperty('--i', i);
  var p = document.createElementNS(ns,'path');
  p.setAttribute('pathLength','30'); p.setAttribute('d','M4.5 11 L9.5 18 L19.5 5.5');
  s.appendChild(p); return s;
}

function applyLang(l){
  lang = l; var t = I18N[l];
  document.documentElement.lang = l;
  document.title = t.title;
  document.querySelector('meta[name="description"]').setAttribute('content', t.desc);
  ['h1','sub','cta','trust','panel_title','steps_title','form_title','form_sub','who','consent_note','faq_title'].forEach(function(k){ $(k).textContent = t[k]; });
  $('sticky_cta').textContent = t.cta;
  $('submitBtn').textContent = t.submit;
  $('done_title').textContent = t.done_title; $('done_text').textContent = t.done_text;
  $('footer_text').textContent = t.footer;

  var pl = $('panel_list'); pl.textContent = '';
  t.panel.forEach(function(txt,i){ var li = el('li'); li.appendChild(tickSvg(i)); li.appendChild(el('span','',txt)); pl.appendChild(li); });

  var fl = $('fcb_list'); fl.textContent = '';
  t.fcb.forEach(function(x){ var d = el('div','fcb-item'); d.appendChild(el('h3','',x[0])); d.appendChild(el('p','',x[1])); fl.appendChild(d); });

  var sl = $('steps_list'); sl.textContent = '';
  t.steps.forEach(function(x,i){ var li = el('li'); li.appendChild(el('div','step-n',String(i+1))); li.appendChild(el('h3','',x[0])); li.appendChild(el('p','',x[1])); sl.appendChild(li); });

  var fq = $('faq_list'); fq.textContent = '';
  t.faq.forEach(function(x){ var d = el('details'); d.appendChild(el('summary','',x[0])); d.appendChild(el('p','',x[1])); fq.appendChild(d); });

  document.querySelectorAll('[data-f]').forEach(function(n){ n.textContent = t.f[n.getAttribute('data-f')]; });
  Object.keys(t.ph).forEach(function(k){ $(k).placeholder = t.ph[k]; });

  document.querySelectorAll('select[data-opts]').forEach(function(sel){
    var keep = sel.value; sel.textContent = '';
    var group = sel.getAttribute('data-opts');
    if (group !== 'contact_pref') { var o0 = el('option','',t.select); o0.value = ''; sel.appendChild(o0); }
    t.opts[group].forEach(function(o){ var op = el('option','',o[1]); op.value = o[0]; sel.appendChild(op); });
    sel.value = keep;
    if (group === 'contact_pref' && !sel.value) sel.value = t.opts.contact_pref[0][0];
  });

  document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === l)); });
  // Mantém ?lang= na URL. Em prévias dentro de iframe o navegador bloqueia isso, então não pode quebrar a página.
  try { var u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null,'',u); } catch (e) {}
}

function setErr(id, msg){
  var f = $(id), e = $('e_' + id);
  if (e) e.textContent = msg || '';
  if (f) { if (msg) f.setAttribute('aria-invalid','true'); else f.removeAttribute('aria-invalid'); }
}

function validate(){
  var t = I18N[lang], first = null;
  REQUIRED.forEach(function(id){
    var v = $(id).value.trim(), msg = '';
    if (!v) msg = t.e_req;
    else if (id === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) msg = t.e_email;
    else if (id === 'phone' && v.replace(/\D/g,'').length < 7) msg = t.e_phone;
    setErr(id, msg);
    if (msg && !first) first = $(id);
  });
  var ok = $('consent').checked;
  $('e_consent').textContent = ok ? '' : t.e_consent;
  if (!ok && !first) first = $('consent');
  if (first) first.focus();
  return !first;
}

function params(){
  var q = new URLSearchParams(location.search), o = {};
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid'].forEach(function(k){ o[k] = q.get(k) || ''; });
  return o;
}

function minMeeting(){
  var d = new Date(Date.now() + 2 * 3600 * 1000), p = function(n){ return String(n).padStart(2,'0'); };
  $('meeting_local').min = d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function showFail(){
  var t = I18N[lang], s = $('status');
  s.className = 'status bad'; s.textContent = '';
  s.appendChild(document.createTextNode(t.fail));
  var a = el('a','',FALLBACK_EMAIL); a.href = 'mailto:' + FALLBACK_EMAIL; s.appendChild(a);
  $('submitBtn').disabled = false; $('submitBtn').textContent = t.submit;
}

function submitForm(ev){
  ev.preventDefault();
  if (!validate()) return;
  var t = I18N[lang], btn = $('submitBtn');
  btn.disabled = true; btn.textContent = t.sending; $('status').textContent = ''; $('status').className = 'status';
  if (ENDPOINT.indexOf('PASTE_') === 0) { console.error('Defina ENDPOINT com a URL do Web App.'); showFail(); return; }

  var data = new URLSearchParams(new FormData($('leadForm')));
  data.set('consent', 'yes');
  data.set('lang', lang);
  data.set('tz', Intl.DateTimeFormat().resolvedOptions().timeZone || '');
  data.set('page_url', location.origin + location.pathname);
  data.set('referrer', document.referrer || '');
  var p = params(); Object.keys(p).forEach(function(k){ data.set(k, p[k]); });

  // no-cors: o navegador não deixa ler a resposta do Apps Script, então sucesso = o envio saiu sem erro de rede
  fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', body: data })
    .then(function(){
      $('leadForm').hidden = true; var d = $('done'); d.hidden = false; d.focus();
      if (window.fbq) { try { fbq('track','Lead'); } catch(e){} }
      if (window.gtag) { try { gtag('event','generate_lead'); } catch(e){} }
    })
    .catch(showFail);
}

function watchSticky(){
  var sticky = $('sticky'), seen = {};
  if (!('IntersectionObserver' in window)) return;
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ seen[e.target.id] = e.isIntersecting; });
    sticky.classList.toggle('off', !!(seen.cta || seen.request));
  });
  io.observe($('cta')); io.observe($('request'));
}

document.querySelectorAll('.lang button').forEach(function(b){ b.addEventListener('click', function(){ applyLang(b.getAttribute('data-lang')); }); });
$('leadForm').addEventListener('submit', submitForm);
REQUIRED.forEach(function(id){ $(id).addEventListener('input', function(){ setErr(id,''); }); });
$('consent').addEventListener('change', function(){ if (this.checked) $('e_consent').textContent = ''; });
minMeeting();
applyLang(pickLang());
watchSticky();
</script>
